<div class="scrollbar-destaques">
    <div class="scrollbar-trilho">
        <div class="scrollbar-progresso" id="scrollbar-progresso"></div>
    </div>
</div>

<script>
    const wrapper = document.getElementById('carrossel-wrapper');
    const trilho = document.querySelector('.scrollbar-trilho');
    const areaToque = document.querySelector('.scrollbar-destaques');
    const polegar = document.getElementById('scrollbar-progresso');

    function atualizarScrollbar() {
        const ratio = wrapper.clientWidth / wrapper.scrollWidth;
        polegar.style.width = (ratio * 100) + '%';
        polegar.style.left = (wrapper.scrollLeft / wrapper.scrollWidth * 100) + '%';
    }
    wrapper.addEventListener('scroll', atualizarScrollbar);
    atualizarScrollbar();

    // Arrastar polegar — área de toque inclui padding ao redor
    let arrastando = false;
    let inicioX, scrollInicio;

    areaToque.addEventListener('mousedown', (e) => {
        arrastando = true;
        inicioX = e.clientX;
        scrollInicio = wrapper.scrollLeft;
        e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
        if (!arrastando) return;
        const delta = e.clientX - inicioX;
        const ratio = wrapper.scrollWidth / trilho.clientWidth;
        wrapper.scrollLeft = scrollInicio + delta * ratio;
    });
    document.addEventListener('mouseup', () => { arrastando = false; });

    // Arrastar carrossel
    let arrastando2 = false;
    let inicioX2, scrollInicio2, moveu;

    wrapper.addEventListener('mousedown', (e) => {
        arrastando2 = true;
        moveu = false;
        inicioX2 = e.clientX;
        scrollInicio2 = wrapper.scrollLeft;
        wrapper.style.cursor = 'grabbing';
        e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
        if (!arrastando2) return;
        const delta = e.clientX - inicioX2;
        if (Math.abs(delta) > 5) moveu = true;
        wrapper.scrollLeft = scrollInicio2 - delta;
    });
    document.addEventListener('mouseup', () => {
        arrastando2 = false;
        wrapper.style.cursor = 'grab';
    });

    wrapper.querySelectorAll('.card-destaque').forEach(card => {
        card.addEventListener('click', (e) => {
            if (moveu) e.preventDefault();
        });
    });
</script>
